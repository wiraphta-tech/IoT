<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMART DASHBOARD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#050505;
color:white;
padding:20px;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:30px;
text-shadow:
0 0 10px red,
0 0 20px orange,
0 0 40px yellow;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:#111;
border:1px solid #333;
border-radius:20px;
padding:20px;
box-shadow:0 0 15px rgba(255,100,0,.4);
}

.card h2{
margin-bottom:15px;
color:#ffae00;
}

button{
width:100%;
height:55px;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
color:white;
background:linear-gradient(45deg,#ff0000,#ff8800);
}

.slider{
width:100%;
}

.value{
text-align:center;
font-size:24px;
margin-top:10px;
}

.status{
font-size:30px;
text-align:center;
margin-top:10px;
}

.gauge{
width:220px;
height:220px;
margin:auto;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
position:relative;
background:conic-gradient(
#ff0000 0deg,
#ffaa00 180deg,
#222 180deg
);
}

.gauge::before{
content:'';
position:absolute;
width:170px;
height:170px;
background:#111;
border-radius:50%;
}

.temp{
position:relative;
z-index:1;
font-size:36px;
font-weight:bold;
}

input[type=text]{
width:100%;
height:50px;
padding:10px;
border:none;
border-radius:10px;
font-size:18px;
margin-bottom:10px;
}

.send{
background:linear-gradient(
45deg,
#ff6600,
#ffaa00
);
}

.response{
font-size:24px;
text-align:center;
color:#00ffd5;
margin-top:10px;
}

</style>
</head>
<body>

<h1 class="title">⚡ SMART CONTROL DASHBOARD ⚡</h1>

<div class="grid">

<div class="card">
<h2>🔌 เปิด / ปิด LED</h2>

<button onclick="toggleLED()">
ON / OFF
</button>

<div class="status" id="ledStatus">
Loading...
</div>
</div>

<div class="card">
<h2>💡 ปรับค่าแสง</h2>

<input
type="range"
min="0"
max="255"
value="0"
class="slider"
oninput="updateBrightness(this.value)"
>

<div class="value" id="brightnessValue">
0
</div>
</div>

<div class="card">
<h2>🌡 ตั้งค่าอุณหภูมิ</h2>

<input
type="range"
min="0"
max="100"
value="25"
class="slider"
oninput="updateTemperature(this.value)"
>

<div class="value" id="tempSliderValue">
25°C
</div>
</div>

<div class="card">
<h2>🌡 ค่าอุณหภูมิ</h2>

<div class="gauge" id="gauge">
<div class="temp" id="tempValue">
0°C
</div>
</div>
</div>

<div class="card">
<h2>📨 ส่งข้อความ</h2>

<input
type="text"
id="messageInput"
placeholder="พิมพ์ข้อความ..."
>

<button class="send" onclick="sendMessage()">
ส่งข้อความ
</button>
</div>

<div class="card">
<h2>📋 การตอบกลับ</h2>

<div class="response" id="responseText">
Loading...
</div>
</div>

</div>

<script>

const TOKEN="J5XNsxF6kWPCI_9d-owdvHD6wCRcc0L9";

let ledState=0;

async function toggleLED(){

ledState=ledState?0:1;

await fetch(
`https://blynk.cloud/external/api/update?token=${TOKEN}&V0=${ledState}`
);

getData();
}

async function updateBrightness(v){

document.getElementById(
"brightnessValue"
).innerHTML=v;

await fetch(
`https://blynk.cloud/external/api/update?token=${TOKEN}&V2=${v}`
);
}

async function updateTemperature(v){

document.getElementById(
"tempSliderValue"
).innerHTML=v+"°C";

await fetch(
`https://blynk.cloud/external/api/update?token=${TOKEN}&V3=${v}`
);
}

async function sendMessage(){

let msg=document.getElementById(
"messageInput"
).value;

await fetch(
`https://blynk.cloud/external/api/update?token=${TOKEN}&V4=${encodeURIComponent(msg)}`
);

alert("ส่งข้อความสำเร็จ");
}

async function getData(){

try{

let led=
await fetch(
`https://blynk.cloud/external/api/get?token=${TOKEN}&V1`
);

let ledValue=
await led.text();

document.getElementById(
"ledStatus"
).innerHTML=
ledValue=="1"
?"🟢 ON"
:"🔴 OFF";

let temp=
await fetch(
`https://blynk.cloud/external/api/get?token=${TOKEN}&V3`
);

let tempValue=
await temp.text();

document.getElementById(
"tempValue"
).innerHTML=
tempValue+"°C";

let deg=
(tempValue/100)*360;

document.getElementById(
"gauge"
).style.background=
`conic-gradient(
#ff0000 0deg,
#ffaa00 ${deg}deg,
#222 ${deg}deg
)`;

let text=
await fetch(
`https://blynk.cloud/external/api/get?token=${TOKEN}&V4`
);

let msg=
await text.text();

document.getElementById(
"responseText"
).innerHTML=msg;

}
catch(e){
console.log(e);
}

}

getData();

setInterval(
getData,
2000
);

</script>

</body>
</html>
